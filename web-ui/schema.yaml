  /api/users:
    get:
      operationId: users_list
      description: |-
        Lists all users in the system.

        Individual users (and their stats) are viewable by anyone the site
        privacy setting admits, mirroring the public drinker pages; the full
        user listing requires authentication. User management (create, edit,
        enable/disable, staff status, set-password) is admin-only; there is
        no delete — accounts are disabled instead.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_staff
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - users
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: users_create
      description: |-
        Lists all users in the system.

        Individual users (and their stats) are viewable by anyone the site
        privacy setting admits, mirroring the public drinker pages; the full
        user listing requires authentication. User management (create, edit,
        enable/disable, staff status, set-password) is admin-only; there is
        no delete — accounts are disabled instead.
