name: Docker Build

env:
  IMAGE_NAME: kegbot/server
  REGISTRY: ghcr.io

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - stable
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare
        id: prepare
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            echo "version=${TAG%-*}" >> $GITHUB_OUTPUT
          else
            echo "version=snapshot" >> $GITHUB_OUTPUT
          fi
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Set up the tag(s) we will build/push. The `metadata-action` action has
      # a bunch of rules and a little language for specifying this. This should
      # be how it's configured:
      #
      # =================== ============================= =============
      # When                What                          Example
      # =================== ============================= =============
      # All runs            "dev"                         dev
      # Merge tag           <tag>                         v1.2.3b1
      # Merge semver tag    <semver>                      1.2.3
      # Merge semver tag    <major>.<minor>               1.2
      # Merge semver tag    "latest" (non-prerelease)     latest
      #
      # Note that "latest" follows tagged releases (via `flavor: latest=auto`),
      # NOT merges to main; main merges publish only "dev".
      - name: Set up docker tag names
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=dev
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build locally
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.prepare.outputs.build_date }}
            GIT_SHORT_SHA=${GITHUB_SHA::8}
            VERSION=${{ steps.prepare.outputs.version }}
          platforms: |
            linux/amd64
            linux/arm64

      - name: Log in to container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.prepare.outputs.build_date }}
            GIT_SHORT_SHA=${GITHUB_SHA::8}
            VERSION=${{ steps.prepare.outputs.version }}
          platforms: |
            linux/amd64
            linux/arm64
