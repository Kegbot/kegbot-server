          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequestRequest'
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
components:
  schemas:
    ActivateAccountRequestRequest:
      type: object
      properties:
        activation_key:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - activation_key
      - password
    AdminDashboard:
      type: object
      properties:
        email_configured:
          type: boolean
        redis_error:
          type: string
          nullable: true
        num_users:
          type: integer
        num_new_users:
          type: integer
      required:
      - email_configured
      - num_new_users
      - num_users
      - redis_error
    AdminUserCreateRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^[\w.@+-]+$
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        password:
          type: string
          minLength: 1
        is_staff:
          type: boolean
          default: false
      required:
      - password
      - username
    ApiKey:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          nullable: true
          description: User receiving API access.
          readOnly: true
        device_id:
          type: integer
          nullable: true
          description: Device this key is associated with.
          readOnly: true
        is_active:
          type: boolean
        key:
          type: string
          readOnly: true
        description:
          type: string
          nullable: true
          description: Information about this key.
        created_time:
          type: string
          format: date-time
          description: Time the key was created.
      required:
      - device_id
      - id
      - is_active
      - key
      - user_id
    ApiKeyRequest:
      type: object
      properties:
        is_active:
          type: boolean
        description:
          type: string
          nullable: true
          description: Information about this key.
        created_time:
          type: string
          format: date-time
          description: Time the key was created.
      required:
      - is_active
    AuthenticationToken:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        auth_device:
          type: string
          description: Namespace for this token.
          maxLength: 64
        token_value:
          type: string
          description: Actual value of the token, unique within an auth_device.
          maxLength: 128
        nice_name:
          type: string
          nullable: true
          description: A human-readable alias for the token, for example "Guest Key".
          maxLength: 256
        pin:
          type: string
          nullable: true
          description: A secret value necessary to authenticate with this token.
          maxLength: 256
        user_id:
          type: integer
          nullable: true
          description: User in possession of and authenticated by this token.
          readOnly: true
        enabled:
          type: boolean
          description: Whether this token is considered active.
        created_time:
          type: string
          format: date-time
          readOnly: true
          description: Date token was first added to the system.
        expire_time:
          type: string
          format: date-time
          nullable: true
          description: Date after which token is treated as disabled.
      required:
      - auth_device
      - created_time
      - id
      - token_value
      - user_id
    AuthenticationTokenRequest:
      type: object
      properties:
        auth_device:
          type: string
          minLength: 1
          description: Namespace for this token.
          maxLength: 64
        token_value:
          type: string
          minLength: 1
          description: Actual value of the token, unique within an auth_device.
          maxLength: 128
        nice_name:
          type: string
          nullable: true
          description: A human-readable alias for the token, for example "Guest Key".
          maxLength: 256
        pin:
          type: string
          nullable: true
          description: A secret value necessary to authenticate with this token.
          maxLength: 256
        user:
          type: integer
          writeOnly: true
          nullable: true
        enabled:
          type: boolean
          description: Whether this token is considered active.
        expire_time:
          type: string
          format: date-time
          nullable: true
          description: Date after which token is treated as disabled.
      required:
      - auth_device
      - token_value
    Beverage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of the beverage, such as "Potrero Pale".
          maxLength: 255
        producer:
          allOf:
          - $ref: '#/components/schemas/BeverageProducer'
          readOnly: true
        beverage_type:
          $ref: '#/components/schemas/BeverageTypeEnum'
        style:
          type: string
          nullable: true
          description: Beverage style within type, eg "Pale Ale", "Pinot Noir".
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Free-form description of the beverage.
        picture:
          allOf:
          - $ref: '#/components/schemas/Picture'
          readOnly: true
        vintage_year:
          type: string
          format: date
          nullable: true
          description: Date of production, for wines or special/seasonal editions
        abv_percent:
          type: number
          format: double
          nullable: true
          title: ABV Percentage
          description: Alcohol by volume, as percentage (0.0-100.0).
        calories_per_ml:
          type: number
          format: double
          nullable: true
          description: Calories per mL of beverage.
        carbs_per_ml:
          type: number
          format: double
          nullable: true
          description: Carbohydrates per mL of beverage.
        color_hex:
          type: string
          title: Color (Hex Value)
          description: Approximate beverage color
          pattern: (^#[0-9a-zA-Z]{3}$)|(^#[0-9a-zA-Z]{6}$)
          maxLength: 16
        original_gravity:
          type: number
          format: double
          nullable: true
          description: Original gravity (beer only).
        specific_gravity:
          type: number
          format: double
          nullable: true
          description: Final gravity (beer only).
        srm:
          type: number
          format: double
          nullable: true
          title: SRM Value
          description: Standard Reference Method value (beer only).
        ibu:
          type: number
          format: double
          nullable: true
          title: IBUs
          description: International Bittering Units value (beer only).
        star_rating:
          type: number
          format: double
          maximum: 5.0
          minimum: 0.0
          nullable: true
          description: 'Star rating for beverage (0: worst, 5: best)'
        untappd_beer_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Untappd.com resource ID (beer only).
      required:
      - id
      - name
      - picture
      - producer
    BeverageProducer:
