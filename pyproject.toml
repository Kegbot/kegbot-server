[project]
name = "kegbot"
version = "1.3.0"
description = "Kegbot Server"
authors = [{ name = "The Kegbot Project contributors" }]
license = "MIT"
requires-python = ">=3.10.4,<4"
dependencies = [
    "addict",
    "coloredlogs",
    "dj-database-url",
    "dj-email-url",
    "django-bootstrap-pagination",
    "django-cors-headers>=3.13.0,<4",
    "django-crispy-forms==1.14.0",
    "django-imagekit",
    "django-redis",
    "django-registration",
    "django-rq>=2.5.1,<3",
    "djangorestframework>=3.13.1,<4",
    "Django==3.2.15",
    "fakeredis",
    "freezegun>=1.2.1,<2",
    "future>=0.18.2,<0.19",
    "gevent",
    "gunicorn",
    "httplib2",
    "isodate",
    "mysqlclient",
    "oauthlib",
    "Pillow",
    "pilkit",
    "protobuf==3.20.0",
    "psycopg2",
    "python-gflags",
    "pytz",
    "PyYAML",
    "redis",
    "requests",
    "requests-oauthlib",
    "rq>=1.10.1,<2",
    "whitenoise",
]

[project.urls]
repository = "https://github.com/Kegbot/kegbot-server"

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
    "pytest-django",
    "requests-mock",
    "vcrpy",
]

[tool.uv]
package = true

# mysqlclient/psycopg2 are source-only (need system libs); keep them in the
# lock for CI/Docker but skip locally where those libs are absent, e.g.:
#   uv sync --no-install-package mysqlclient --no-install-package psycopg2

[tool.black]
line-length = 100
target_version = ['py310']
include = 'pykeg/.*\.pyi?$'
exclude = '''
(
  .*/migrations/.*
)
'''

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pykeg"]
