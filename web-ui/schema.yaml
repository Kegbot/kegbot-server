        session_timeout_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Maximum time, in minutes, that a session may be idle (no pours)
            before it is considered to be finished.  Recommended value is 180.
        google_analytics_id:
          type: string
          nullable: true
          description: 'Set to your Google Analytics ID to enable tracking. Example:
            UA-XXXX-y'
          maxLength: 64
        email_config:
          type: string
          description: Backend email configuration
          pattern: '^(console|smtp|submission|dummy|memory):'
        background_image:
          allOf:
          - $ref: '#/components/schemas/Picture'
          readOnly: true
      required:
      - background_image
      - is_setup
      - name
      - server_version
    Stats:
      type: object
      properties:
        time:
          type: string
          format: date-time
        stats: {}
        drink_id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          nullable: true
          readOnly: true
        keg_id:
          type: integer
          nullable: true
          readOnly: true
        session_id:
          type: integer
          nullable: true
          readOnly: true
      required:
      - drink_id
      - keg_id
      - session_id
      - stats
      - user_id
    SystemEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/SystemEventKindEnum'
          description: |-
            Type of event.

            * `drink_poured` - Drink poured
            * `session_started` - Session started
            * `session_joined` - User joined session
            * `keg_tapped` - Keg tapped
            * `keg_volume_low` - Keg volume low
            * `keg_ended` - Keg ended
        time:
          type: string
          format: date-time
          description: Time of the event.
        drink:
          allOf:
          - $ref: '#/components/schemas/Drink'
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        keg:
          allOf:
          - $ref: '#/components/schemas/Keg'
          readOnly: true
        session:
          allOf:
          - $ref: '#/components/schemas/DrinkingSession'
          readOnly: true
      required:
      - drink
      - id
      - keg
      - kind
      - session
      - time
      - user
    SystemEventKindEnum:
      enum:
      - drink_poured
      - session_started
      - session_joined
      - keg_tapped
      - keg_volume_low
      - keg_ended
      type: string
      description: |-
        * `drink_poured` - Drink poured
        * `session_started` - Session started
        * `session_joined` - User joined session
        * `keg_tapped` - Keg tapped
        * `keg_volume_low` - Keg volume low
        * `keg_ended` - Keg ended
    SystemStatus:
      type: object
      description: A summarized system status status, with the most common "current
        status" data.
      properties:
        site:
          $ref: '#/components/schemas/KegbotSite'
        taps:
          type: array
          items:
            $ref: '#/components/schemas/KegTap'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SystemEvent'
      required:
      - events
      - site
      - taps
    TapAttachKegRequestRequest:
      type: object
      properties:
        keg_id:
          type: integer
      required:
      - keg_id
    TapConnectMeterRequestRequest:
      type: object
      properties:
        meter_id:
          type: integer
          nullable: true
      required:
      - meter_id
    TapConnectThermoRequestRequest:
      type: object
      properties:
        thermo_sensor_id:
          type: integer
          nullable: true
      required:
      - thermo_sensor_id
    TapConnectToggleRequestRequest:
      type: object
      properties:
        toggle_id:
          type: integer
          nullable: true
      required:
      - toggle_id
    TapRecordDrinkRequestRequest:
      type: object
      properties:
        volume_ml:
          type: number
          format: double
          minimum: 0.0
        username:
          type: string
          default: ''
        pour_time:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          minimum: 0
          default: 0
        shout:
          type: string
          default: ''
        spilled:
          type: boolean
          default: false
      required:
      - volume_ml
    TemperatureDisplayUnitsEnum:
      enum:
      - f
      - c
      type: string
      description: |-
        * `f` - Fahrenheit
        * `c` - Celsius
    ThermoSensor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        raw_name:
          type: string
          maxLength: 256
        nice_name:
          type: string
          maxLength: 128
      required:
      - id
      - nice_name
      - raw_name
    ThermoSensorRequest:
      type: object
      properties:
        raw_name:
          type: string
          minLength: 1
          maxLength: 256
        nice_name:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - nice_name
      - raw_name
    Thermolog:
      type: object
      properties:
        time:
          type: string
          format: date-time
        temp:
          type: number
          format: double
        sensor_id:
          type: integer
          readOnly: true
      required:
      - sensor_id
      - temp
      - time
