    PatchedKegRequest:
      type: object
      properties:
        keg_type:
          allOf:
          - $ref: '#/components/schemas/KegTypeEnum'
          description: |-
            Keg container type, used to initialize keg's full volume

            * `mini` - Mini Keg (5 L)
            * `corny-2_5-gal` - Corny Keg (2.5 gal)
            * `corny-3-gal` - Corny Keg (3.0 gal)
            * `corny` - Corny Keg (5 gal)
            * `sixth` - Sixth Barrel (5.17 gal)
            * `euro-30-liter` - European DIN (30 L)
            * `euro-half` - European Half Barrel (50 L)
            * `quarter` - Quarter Barrel (7.75 gal)
            * `euro` - European Full Barrel (100 L)
            * `half-barrel` - Half Barrel (15.5 gal)
            * `other` - Other
        full_volume_ml:
          type: number
          format: double
          description: Full volume of this Keg; usually set automatically from keg_type.
        description:
          type: string
          nullable: true
          description: User-visible description of the Keg.
        notes:
          type: string
          nullable: true
          description: Private notes about this keg, viewable only by admins.
    PatchedKegTapRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: The display name for this tap, for example, "Main Tap".
          maxLength: 128
        notes:
          type: string
          nullable: true
          description: Private notes about this tap.
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Position relative to other taps when sorting (0=first).
    PatchedNotificationSettingsRequest:
      type: object
      properties:
        backend:
          type: string
          minLength: 1
          description: Notification backend (dotted path) for these settings.
          maxLength: 255
        keg_tapped:
          type: boolean
          description: Sent when a keg is activated.
        session_started:
          type: boolean
          description: Sent when a new drinking session starts.
        keg_volume_low:
          type: boolean
          description: Sent when a keg becomes low.
        keg_ended:
          type: boolean
          description: Sent when a keg has been taken offline.
    PatchedPluginDataRequest:
      type: object
      properties:
        plugin_name:
          type: string
          minLength: 1
          description: Plugin short name
          maxLength: 127
        key:
          type: string
          minLength: 1
          maxLength: 127
        value: {}
    PatchedProfileUpdateRequestRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 127
    PatchedSiteSettingsRequest:
      type: object
      description: Admin-editable site settings, covering the old settings forms.
      properties:
        title:
          type: string
          minLength: 1
          description: The title of this site.
          maxLength: 64
        privacy:
          allOf:
          - $ref: '#/components/schemas/PrivacyEnum'
          description: |-
            Who can view Kegbot data?

            * `public` - Public: Browsing does not require login
            * `members` - Members only: Must log in to browse
            * `staff` - Staff only: Only logged-in staff accounts may browse
        registration_mode:
          allOf:
          - $ref: '#/components/schemas/RegistrationModeEnum'
          description: |-
            Who can join this Kegbot from the web site?

            * `public` - Public: Anyone can register.
            * `member-invite-only` - Member Invite: Must be invited by an existing member.
            * `staff-invite-only` - Staff Invite Only: Must be invited by a staff member.
        enable_sensing:
          type: boolean
          description: Enable and show features related to volume sensing.
        enable_users:
          type: boolean
          description: Enable user pour tracking.
        volume_display_units:
          allOf:
          - $ref: '#/components/schemas/VolumeDisplayUnitsEnum'
          description: |-
            Unit system to use when displaying volumetric data.

            * `metric` - Metric (mL, L)
            * `imperial` - Imperial (oz, pint)
