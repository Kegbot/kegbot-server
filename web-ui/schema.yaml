openapi: 3.0.3
info:
  title: Kegbot Server API
  version: ''
  description: The Kegbot Server REST API.
paths:
  /api/account/activate:
    post:
      operationId: account_activate_create
      description: 'Activates an invited/created account: sets its password and logs
        in.'
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/account/confirm-email:
    post:
      operationId: account_confirm_email_create
      description: Applies an email change, given the token from the confirmation
        mail.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequestRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/account/email:
    post:
      operationId: account_email_create
      description: Requests an email change; a confirmation link is mailed to the
        new address.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailChangeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailChangeRequestRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: ''
  /api/account/mugshot:
    post:
      operationId: account_mugshot_create
      description: Sets the current user's mugshot.
      tags:
      - account
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PictureUploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PictureUploadRequestRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/account/password:
    post:
      operationId: account_password_create
      description: Changes the current user's password, keeping the session valid.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: ''
  /api/account/regenerate-api-key:
    post:
      operationId: account_regenerate_api_key_create
      description: Discards and regenerates the current user's API key.
      tags:
      - account
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
  /api/admin/backups:
    get:
      operationId: admin_backups_retrieve
      description: Lists existing backups (GET) or starts building a new one (POST).
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: admin_backups_create
      description: Lists existing backups (GET) or starts building a new one (POST).
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/backups/{filename}:
    delete:
      operationId: admin_backups_destroy
      description: Deletes a backup archive by filename.
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/bugreport:
    get:
      operationId: admin_bugreport_retrieve
      description: Generates and returns a bugreport (may contain secrets; admin eyes
        only).
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/dashboard:
    get:
      operationId: admin_dashboard_retrieve
      description: System health summary for the admin dashboard.
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/admin/email-test:
    post:
      operationId: admin_email_test_create
      description: Sends a test notification email to the given address.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTestRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTestRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTestRequestRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: ''
  /api/admin/kegboards:
    get:
      operationId: admin_kegboards_list
      description: 'Lists kegboard devices: unpaired boards streaming in, and paired
        boards.'
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KegboardDevice'
          description: ''
  /api/admin/kegboards/{device}:
    delete:
      operationId: admin_kegboards_destroy
      description: Drops a pending or denied kegboard from the roster.
      parameters:
      - in: path
        name: device
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/kegboards/{device}/allow:
    post:
      operationId: admin_kegboards_allow_create
      description: 'Approves a kegboard: mints its token and creates its controller.'
      parameters:
      - in: path
        name: device
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KegboardDevice'
          description: ''
  /api/admin/kegboards/{device}/deny:
    post:
      operationId: admin_kegboards_deny_create
      description: Refuses a kegboard; it stays listed so the decision can be reversed.
      parameters:
      - in: path
        name: device
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KegboardDevice'
          description: ''
  /api/admin/kegboards/{device}/revoke:
    post:
      operationId: admin_kegboards_revoke_create
      description: Revokes a kegboard's token; its next request re-enters pairing.
      parameters:
      - in: path
        name: device
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/logs:
    get:
      operationId: admin_logs_retrieve
      description: Returns recent log records (newest first) from the redis log handler.
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/plugins:
    get:
      operationId: admin_plugins_retrieve
      description: Lists installed plugins.
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/plugins/{short_name}/settings:
    get:
      operationId: admin_plugins_settings_retrieve
      description: |-
        Reads or updates a plugin's site settings.

        Writes are validated through the plugin's own settings form; field
        errors come back in standard DRF shape.
      parameters:
      - in: path
        name: short_name
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: admin_plugins_settings_update
      description: |-
        Reads or updates a plugin's site settings.

        Writes are validated through the plugin's own settings form; field
        errors come back in standard DRF shape.
      parameters:
      - in: path
        name: short_name
        schema:
          type: string
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/api-keys:
    get:
      operationId: api_keys_list
      description: Lists a user's own api keys.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api-keys
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiKeyList'
          description: ''
    post:
      operationId: api_keys_create
      description: Lists a user's own api keys.
      tags:
      - api-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
  /api/api-keys/{id}:
    get:
      operationId: api_keys_retrieve
      description: Lists a user's own api keys.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api key.
        required: true
      tags:
      - api-keys
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
    put:
      operationId: api_keys_update
      description: Lists a user's own api keys.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api key.
        required: true
      tags:
      - api-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
    patch:
      operationId: api_keys_partial_update
      description: Lists a user's own api keys.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api key.
        required: true
      tags:
      - api-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApiKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApiKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApiKeyRequest'
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
    delete:
      operationId: api_keys_destroy
      description: Lists a user's own api keys.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api key.
        required: true
      tags:
      - api-keys
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth-tokens:
    get:
      operationId: auth_tokens_list
      description: Lists all AuthenticationTokens in the system.
      parameters:
      - in: query
        name: auth_device
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: enabled
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - auth-tokens
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthenticationTokenList'
          description: ''
    post:
      operationId: auth_tokens_create
      description: Lists all AuthenticationTokens in the system.
      tags:
      - auth-tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthenticationTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthenticationTokenRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationToken'
          description: ''
  /api/auth-tokens/{id}:
    get:
      operationId: auth_tokens_retrieve
      description: Lists all AuthenticationTokens in the system.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this authentication token.
        required: true
      tags:
      - auth-tokens
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationToken'
          description: ''
    put:
      operationId: auth_tokens_update
      description: Lists all AuthenticationTokens in the system.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this authentication token.
        required: true
      tags:
      - auth-tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthenticationTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthenticationTokenRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationToken'
          description: ''
    patch:
      operationId: auth_tokens_partial_update
      description: Lists all AuthenticationTokens in the system.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this authentication token.
        required: true
      tags:
      - auth-tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAuthenticationTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAuthenticationTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAuthenticationTokenRequest'
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationToken'
          description: ''
    delete:
      operationId: auth_tokens_destroy
      description: Lists all AuthenticationTokens in the system.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this authentication token.
        required: true
      tags:
      - auth-tokens
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: ''
  /api/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      description: Mails a password-reset link. Always succeeds (no account enumeration).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: ''
  /api/auth/password-reset-confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: Sets a new password, given the uid/token pair from a reset mail.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      description: Registers a new account, honoring the site's registration mode.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/beverage-producers:
    get:
      operationId: beverage_producers_list
      description: Lists all beverage producers in the system.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - beverage-producers
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBeverageProducerList'
          description: ''
    post:
      operationId: beverage_producers_create
      description: Lists all beverage producers in the system.
      tags:
      - beverage-producers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeverageProducerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BeverageProducerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BeverageProducerRequest'
        required: true
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeverageProducer'
          description: ''
  /api/beverage-producers/{id}:
    get:
      operationId: beverage_producers_retrieve
      description: Lists all beverage producers in the system.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this beverage producer.
        required: true
      tags:
      - beverage-producers
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeverageProducer'
          description: ''
    put:
      operationId: beverage_producers_update
      description: Lists all beverage producers in the system.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this beverage producer.
        required: true
      tags:
      - beverage-producers
      requestBody:
        content:
