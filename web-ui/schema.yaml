    PatchedBeverageRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the beverage, such as "Potrero Pale".
          maxLength: 255
        producer_id:
          type: integer
          writeOnly: true
        beverage_type:
          $ref: '#/components/schemas/BeverageTypeEnum'
        style:
          type: string
          nullable: true
          description: Beverage style within type, eg "Pale Ale", "Pinot Noir".
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Free-form description of the beverage.
        vintage_year:
          type: string
          format: date
          nullable: true
          description: Date of production, for wines or special/seasonal editions
        abv_percent:
          type: number
          format: double
          nullable: true
          title: ABV Percentage
          description: Alcohol by volume, as percentage (0.0-100.0).
        calories_per_ml:
          type: number
          format: double
          nullable: true
          description: Calories per mL of beverage.
        carbs_per_ml:
          type: number
          format: double
          nullable: true
          description: Carbohydrates per mL of beverage.
        color_hex:
          type: string
          minLength: 1
          title: Color (Hex Value)
          description: Approximate beverage color
          pattern: (^#[0-9a-zA-Z]{3}$)|(^#[0-9a-zA-Z]{6}$)
          maxLength: 16
        original_gravity:
          type: number
          format: double
          nullable: true
          description: Original gravity (beer only).
        specific_gravity:
          type: number
          format: double
          nullable: true
          description: Final gravity (beer only).
        srm:
          type: number
          format: double
          nullable: true
          title: SRM Value
          description: Standard Reference Method value (beer only).
        ibu:
          type: number
          format: double
          nullable: true
          title: IBUs
          description: International Bittering Units value (beer only).
        star_rating:
          type: number
          format: double
          maximum: 5.0
          minimum: 0.0
          nullable: true
          description: 'Star rating for beverage (0: worst, 5: best)'
        untappd_beer_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Untappd.com resource ID (beer only).
    PatchedControllerRequest:
