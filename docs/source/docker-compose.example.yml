services:
  kegbot:
    image: ghcr.io/kegbot/server:latest
    restart: unless-stopped
    command: run_server
    ports:
      - "8000:8000"
    volumes:
      - kegbot-data:/kegbot-data
    tmpfs:
      - /tmp
      - /var/tmp
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql://kegbot:changeme@mysql/kegbot
      KEGBOT_ENV: "debug"
      KEGBOT_SECRET_KEY: "changeme"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  workers:
    image: ghcr.io/kegbot/server:latest
    restart: unless-stopped
    command: run_workers
    volumes:
      - kegbot-data:/kegbot-data
    tmpfs:
      - /tmp
      - /var/tmp
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql://kegbot:changeme@mysql/kegbot
      KEGBOT_ENV: "debug"
      KEGBOT_SECRET_KEY: "changeme"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'changeme'
      MYSQL_USER: 'kegbot'
      MYSQL_PASSWORD: 'changeme'
      MYSQL_DATABASE: 'kegbot'
    healthcheck:
      # Ping over TCP: during init the image runs a socket-only temporary
      # server that would pass a plain socket ping too early.
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    tmpfs:
      - /tmp
      - /var/tmp
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:latest
    restart: always

volumes:
  mysql-data:
  kegbot-data:
