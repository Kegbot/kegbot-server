    Keg:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        beverage:
          allOf:
          - $ref: '#/components/schemas/Beverage'
          readOnly: true
        keg_type:
          allOf:
          - $ref: '#/components/schemas/KegTypeEnum'
          description: |-
            Keg container type, used to initialize keg's full volume

            * `mini` - Mini Keg (5 L)
            * `corny-2_5-gal` - Corny Keg (2.5 gal)
            * `corny-3-gal` - Corny Keg (3.0 gal)
            * `corny` - Corny Keg (5 gal)
            * `sixth` - Sixth Barrel (5.17 gal)
            * `euro-30-liter` - European DIN (30 L)
            * `euro-half` - European Half Barrel (50 L)
            * `quarter` - Quarter Barrel (7.75 gal)
            * `euro` - European Full Barrel (100 L)
            * `half-barrel` - Half Barrel (15.5 gal)
            * `other` - Other
        served_volume_ml:
          type: number
          format: double
          readOnly: true
          description: Computed served volume.
        full_volume_ml:
          type: number
          format: double
          description: Full volume of this Keg; usually set automatically from keg_type.
        start_time:
          type: string
          format: date-time
          readOnly: true
          description: Time the Keg was first tapped.
        end_time:
          type: string
          format: date-time
          readOnly: true
          description: Time the Keg was finished or disconnected.
        status:
          allOf:
          - $ref: '#/components/schemas/KegStatusEnum'
          readOnly: true
          description: |-
            Current keg state.

            * `available` - Available
            * `on_tap` - On tap
            * `finished` - Finished
        description:
          type: string
          nullable: true
          description: User-visible description of the Keg.
        spilled_ml:
          type: number
          format: double
          readOnly: true
          description: Amount of beverage poured without an associated Drink.
        notes:
          type: string
          nullable: true
          description: Private notes about this keg, viewable only by admins.
        illustration:
          type: string
          format: uri
          readOnly: true
        illustration_thumbnail:
          type: string
          format: uri
          readOnly: true
        stats:
          readOnly: true
      required:
      - beverage
      - end_time
      - id
      - illustration
      - illustration_thumbnail
      - served_volume_ml
      - spilled_ml
      - start_time
      - stats
      - status
    KegCreateRequestRequest:
      type: object
      description: |-
        Parameters for creating a keg.

        The beverage may be given as an existing `beverage_id`, or described by
        the (`beverage_name`, `producer_name`, `style_name`, `beverage_type`)
        tuple, which matches or creates one.
      properties:
        beverage_id:
          type: integer
          nullable: true
        beverage_name:
          type: string
          default: ''
        beverage_type:
          allOf:
          - $ref: '#/components/schemas/BeverageTypeEnum'
          default: beer
        producer_name:
          type: string
          default: ''
        style_name:
          type: string
          default: ''
        keg_type:
          allOf:
          - $ref: '#/components/schemas/KegTypeEnum'
          default: half-barrel
        full_volume_ml:
          type: number
          format: double
          nullable: true
        description:
          type: string
          default: ''
        notes:
          type: string
          default: ''
    KegRequest:
      type: object
      properties:
        keg_type:
          allOf:
          - $ref: '#/components/schemas/KegTypeEnum'
          description: |-
            Keg container type, used to initialize keg's full volume

            * `mini` - Mini Keg (5 L)
            * `corny-2_5-gal` - Corny Keg (2.5 gal)
            * `corny-3-gal` - Corny Keg (3.0 gal)
            * `corny` - Corny Keg (5 gal)
            * `sixth` - Sixth Barrel (5.17 gal)
            * `euro-30-liter` - European DIN (30 L)
            * `euro-half` - European Half Barrel (50 L)
            * `quarter` - Quarter Barrel (7.75 gal)
            * `euro` - European Full Barrel (100 L)
            * `half-barrel` - Half Barrel (15.5 gal)
            * `other` - Other
        full_volume_ml:
          type: number
          format: double
          description: Full volume of this Keg; usually set automatically from keg_type.
        description:
          type: string
          nullable: true
          description: User-visible description of the Keg.
        notes:
          type: string
          nullable: true
          description: Private notes about this keg, viewable only by admins.
