    PatchedThermoSensorRequest:
      type: object
      properties:
        raw_name:
          type: string
          minLength: 1
          maxLength: 256
        nice_name:
          type: string
          minLength: 1
          maxLength: 128
    Picture:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        resized_url:
          type: string
          format: uri
          readOnly: true
        resized_png_url:
          type: string
          format: uri
          readOnly: true
        thumbnail_url:
          type: string
          format: uri
          readOnly: true
        thumbnail_png_url:
          type: string
          format: uri
          readOnly: true
        caption:
          type: string
        user_id:
          type: integer
          nullable: true
          description: User that owns/uploaded this picture
          readOnly: true
        keg_id:
          type: integer
          nullable: true
          description: Keg this picture was taken with, if any.
          readOnly: true
        session_id:
          type: integer
          nullable: true
          description: Session this picture was taken with, if any.
          readOnly: true
      required:
      - caption
      - id
      - keg_id
      - resized_png_url
      - resized_url
      - session_id
      - thumbnail_png_url
      - thumbnail_url
      - user_id
    PictureRequest:
      type: object
      properties:
        caption:
          type: string
          minLength: 1
      required:
      - caption
    PictureUploadRequestRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
        caption:
          type: string
          default: ''
      required:
      - image
    PluginData:
      type: object
      properties:
        plugin_name:
          type: string
          description: Plugin short name
          maxLength: 127
        key:
          type: string
          maxLength: 127
        value: {}
      required:
      - key
      - plugin_name
      - value
    PluginDataRequest:
      type: object
      properties:
        plugin_name:
          type: string
          minLength: 1
          description: Plugin short name
          maxLength: 127
        key:
          type: string
          minLength: 1
          maxLength: 127
        value: {}
      required:
      - key
      - plugin_name
      - value
    PluginInfo:
      type: object
      properties:
        short_name:
          type: string
        name:
          type: string
      required:
      - name
      - short_name
    PrivacyEnum:
      enum:
      - public
      - members
      - staff
      type: string
      description: |-
        * `public` - Public: Browsing does not require login
        * `members` - Members only: Must log in to browse
        * `staff` - Staff only: Only logged-in staff accounts may browse
    RegisterRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^[\w.@+-]+$
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        invite_code:
          type: string
          default: ''
      required:
      - email
      - password
      - username
    RegistrationModeEnum:
      enum:
      - public
      - member-invite-only
      - staff-invite-only
      type: string
      description: |-
        * `public` - Public: Anyone can register.
        * `member-invite-only` - Member Invite: Must be invited by an existing member.
        * `staff-invite-only` - Staff Invite Only: Must be invited by a staff member.
    SessionDirectory:
      type: object
      description: 'The session archive tree: which dates have sessions.'
      properties:
        years:
          type: array
          items:
            $ref: '#/components/schemas/SessionDirectoryYear'
      required:
      - years
    SessionDirectoryMonth:
      type: object
      properties:
        month:
          type: integer
        days:
          type: array
          items:
            type: integer
        count:
          type: integer
      required:
      - count
      - days
      - month
    SessionDirectoryYear:
      type: object
      properties:
        year:
          type: integer
        months:
          type: array
          items:
            $ref: '#/components/schemas/SessionDirectoryMonth'
        count:
          type: integer
      required:
      - count
      - months
      - year
    SetPasswordRequestRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required:
      - password
    SetupAdminUserRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^[\w.@+-]+$
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
      - username
