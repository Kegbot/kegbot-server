# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Install the docs toolchain with uv (from the `docs` dependency group) and
# build with sphinx. The project itself is not installed: the docs use no
# autodoc, so the heavyweight runtime deps (mysqlclient, etc.) are unneeded.
build:
  os: ubuntu-24.04
  tools:
    python: '3.13'
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --only-group docs --frozen
    - uv run --no-sync sphinx-build -T -b html docs/source $READTHEDOCS_OUTPUT/html
