    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 30 characters or fewer. Letters, numbers and @/./+/-/_
            characters
          pattern: ^[\w.@+-]+$
          maxLength: 30
        display_name:
          type: string
          description: Full name, will be shown in some places instead of username
          maxLength: 127
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        picture:
          allOf:
          - $ref: '#/components/schemas/Picture'
          readOnly: true
      required:
      - id
      - is_active
      - is_staff
      - picture
      - username
    VolumeDisplayUnitsEnum:
      enum:
      - metric
      - imperial
      type: string
      description: |-
        * `metric` - Metric (mL, L)
        * `imperial` - Imperial (oz, pint)
  securitySchemes:
    apiKeyBasicAuth:
      type: http
      scheme: basic
      description: Use "api" as the username and an API key as the password.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
