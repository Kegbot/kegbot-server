    get:
      operationId: kegs_list
      description: |-
        Lists all Kegs in the system.

        Reads follow site privacy; keg management requires an admin. Deleting
        a keg permanently destroys it and ALL of its drinks.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - available
          - finished
          - on_tap
        description: |-
          Current keg state.

          * `available` - Available
          * `on_tap` - On tap
          * `finished` - Finished
      tags:
      - kegs
      security:
      - apiKeyBasicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
