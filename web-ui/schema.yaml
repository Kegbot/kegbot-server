    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    Me:
      type: object
      description: |-
        The boot payload: current user plus always-needed site metadata.

        Served to every caller with status 200; `user` is null when the caller
        is not authenticated. Static constants (choice lists, keg sizes, and
        similar) are NOT served here: they are baked into the frontend build
        via the `print_constants` management command.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/CurrentUser'
          nullable: true
        site:
          $ref: '#/components/schemas/SiteConfig'
        can_invite:
          type: boolean
        have_sessions:
          type: boolean
        sso_login_url:
          type: string
        sso_logout_url:
          type: string
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
      required:
      - can_invite
      - have_sessions
      - plugins
      - site
      - sso_login_url
      - sso_logout_url
      - user
    NewKegRequestRequest:
      type: object
      description: |-
        Parameters for creating a keg.

        The beverage may be given as an existing `beverage_id`, or described by
        the (`beverage_name`, `producer_name`, `style_name`, `beverage_type`)
        tuple, which matches or creates one.
      properties:
        beverage_id:
          type: integer
          nullable: true
        beverage_name:
          type: string
          default: ''
        beverage_type:
          allOf:
          - $ref: '#/components/schemas/BeverageTypeEnum'
          default: beer
        producer_name:
          type: string
          default: ''
        style_name:
          type: string
          default: ''
        keg_type:
          allOf:
          - $ref: '#/components/schemas/KegTypeEnum'
          default: half-barrel
        full_volume_ml:
          type: number
          format: double
          nullable: true
    NotificationSettings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          description: User for these settings.
          readOnly: true
        backend:
          type: string
          description: Notification backend (dotted path) for these settings.
          maxLength: 255
        keg_tapped:
          type: boolean
          description: Sent when a keg is activated.
        session_started:
          type: boolean
          description: Sent when a new drinking session starts.
        keg_volume_low:
          type: boolean
          description: Sent when a keg becomes low.
        keg_ended:
          type: boolean
          description: Sent when a keg has been taken offline.
      required:
      - backend
      - id
      - user_id
    NotificationSettingsRequest:
      type: object
      properties:
        backend:
          type: string
          minLength: 1
          description: Notification backend (dotted path) for these settings.
          maxLength: 255
        keg_tapped:
          type: boolean
          description: Sent when a keg is activated.
        session_started:
          type: boolean
          description: Sent when a new drinking session starts.
        keg_volume_low:
          type: boolean
          description: Sent when a keg becomes low.
        keg_ended:
          type: boolean
          description: Sent when a keg has been taken offline.
      required:
      - backend
    PaginatedApiKeyList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    PaginatedAuthenticationTokenList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationToken'
    PaginatedBeverageList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
