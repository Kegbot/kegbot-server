[project]
name = "kegbot"
version = "1.3.0"
description = "Kegbot Server"
authors = [{ name = "The Kegbot Project contributors" }]
license = "MIT"
requires-python = ">=3.10.4,<4"
dependencies = [
    "addict",
    "coloredlogs",
    "dj-database-url",
    "dj-email-url",
    "django-cors-headers>=4.9,<5",
    "django-crispy-forms>=2.4,<3",
    "crispy-bootstrap4>=2024.10",
    "django-imagekit",
    "django-redis>=5.4",
    "django-registration>=5.1",
    "django-rq>=3,<5",
    "djangorestframework>=3.16,<4",
    "Django>=5.2,<5.3",
    "fakeredis",
    "freezegun>=1.2.1,<2",
    "future>=0.18.2,<0.19",
    "httplib2",
    "isodate",
    "mysqlclient",
    "oauthlib",
    "Pillow",
    "pilkit",
    "protobuf==3.20.0",
    "psycopg2",
    "python-gflags",
    "PyYAML",
    "redis",
    "requests",
    "requests-oauthlib",
    "rq>=2,<3",
    "waitress>=3,<4",
    "whitenoise",
]

[project.urls]
repository = "https://github.com/Kegbot/kegbot-server"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-django",
    "requests-mock",
    "ruff",
    "vcrpy",
]

[tool.uv]
package = true

# mysqlclient/psycopg2 are source-only (need system libs); keep them in the
# lock for CI/Docker but skip locally where those libs are absent, e.g.:
#   uv sync --no-install-package mysqlclient --no-install-package psycopg2

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "migrations",
    # Generated protobuf code (regenerated from kegbot-api .proto sources).
    "pykeg/proto/*_pb2.py",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# UP (pyupgrade) is added in the Python 3.14 phase; keep this to format +
# pycodestyle/pyflakes/isort for the tooling swap.
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pykeg"]
